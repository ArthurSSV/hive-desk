<div style="background:#0b0b0c;padding:32px 16px;font-family:Arial,sans-serif">
  <div style="max-width:480px;margin:0 auto;background:#141416;border:1px solid #2a2618;border-radius:14px;padding:28px;color:#eae6da">
    <div style="color:#d4af37;font-weight:700;font-size:18px;margin-bottom:18px">Матрёшка — Челлендж</div>
    <h2 style="margin:0 0 10px;font-size:20px;color:#fff">Новый пароль</h2>
    <p style="margin:0 0 22px;line-height:1.5;color:#bdb7a8">Вы (или админ группы) запросили сброс пароля. Нажмите кнопку и задайте новый пароль. Ссылка действует 1 час.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset" style="display:inline-block;background:#d4af37;color:#0b0b0c;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px">Задать новый пароль</a>
    <p style="margin:22px 0 0;font-size:12px;color:#7d786c">Если вы не запрашивали сброс — просто проигнорируйте письмо, пароль останется прежним.</p>
  </div>
</div>
