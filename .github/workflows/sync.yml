name: Sync cTrader
# Основной запуск — cron-job.org через API GitHub (POST .../actions/workflows/sync.yml/dispatches).
# Расписание ниже — запасное, если внешний запуск не пришёл.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Полная синхронизация (иначе лёгкая: только при изменениях)"
        type: boolean
        default: false
concurrency: { group: sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run sync
        env:
          SYNC_FULL: ${{ github.event_name == 'schedule' && '1' || inputs.full && '1' || '0' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          FUNDEDHIVE_ADDRESSES: ${{ secrets.FUNDEDHIVE_ADDRESSES }}
